<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>網頁版天堂 Lineage Web - 亞丁大陸入口</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0; background: #0c0a09; color: #ddd;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
  }

  #login-screen {
    width: 420px;
    background: linear-gradient(180deg, #1e1a15 0%, #12100d 100%);
    border: 2px solid #7a6342;
    box-shadow: 0 0 35px rgba(0,0,0,0.95), inset 0 0 15px rgba(122, 99, 66, 0.25);
    padding: 32px 36px;
    border-radius: 4px;
    text-align: center;
  }
  .game-logo {
    font-size: 28px; font-weight: bold; color: #e6c27a;
    letter-spacing: 4px; text-shadow: 0 2px 6px #000;
    margin-bottom: 4px;
  }
  .game-subtitle {
    font-size: 12px; color: #8c7a5b; margin-bottom: 24px; letter-spacing: 1px;
  }
  .form-group {
    text-align: left; margin-bottom: 14px;
  }
  .form-group label {
    display: block; font-size: 12px; color: #bba886; margin-bottom: 5px;
  }
  .form-group input {
    width: 100%; padding: 9px 10px;
    background: #0b0a08; border: 1px solid #594933;
    color: #fff; font-size: 14px; border-radius: 3px;
    outline: none; user-select: text;
  }
  .form-group input:focus {
    border-color: #d4af37; box-shadow: 0 0 6px rgba(212, 175, 55, 0.3);
  }
  .login-btn {
    width: 100%; margin-top: 18px; padding: 11px;
    font-size: 15px; font-weight: bold; letter-spacing: 2px;
    background: #3b2e1e; color: #f5dfb3; border: 1px solid #9e7f50;
    cursor: pointer; border-radius: 3px; transition: 0.15s;
  }
  .login-btn:hover { background: #524029; border-color: #ffd700; }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #login-msg {
    margin-top: 14px; font-size: 12px; min-height: 18px; line-height: 1.5;
  }
  .msg-err { color: #e74c3c; }
  .msg-ok { color: #2ecc71; }
  .msg-info { color: #f39c12; }

  /* 驗證通過後開放的轉跳區塊 */
  #portal-box {
    display: none;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #443828;
  }
  .portal-link {
    display: block;
    width: 100%;
    padding: 12px;
    background: linear-gradient(180deg, #8c2d19 0%, #5c190c 100%);
    border: 1px solid #e67e22;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 3px;
    letter-spacing: 2px;
    box-shadow: 0 0 12px rgba(230, 126, 34, 0.4);
    transition: 0.15s;
  }
  .portal-link:hover {
    background: linear-gradient(180deg, #a83820 0%, #732010 100%);
    border-color: #ffd700;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="game-logo">LINEAGE WEB</div>
  <div class="game-subtitle">亞丁大陸通行證驗證</div>

  <div class="form-group">
    <label>遊戲帳號 (Account)</label>
    <input type="text" id="input-user" placeholder="請輸入帳號" autocomplete="off">
  </div>
  <div class="form-group">
    <label>遊戲密碼 (Password)</label>
    <input type="password" id="input-pass" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') verifyAccount()">
  </div>

  <button class="login-btn" id="btn-login" onclick="verifyAccount()">驗證帳號密碼</button>

  <div id="login-msg" class="msg-info">請輸入帳號與密碼進行驗證</div>

  <!-- 只有帳密驗證通過才會顯示並開放轉跳 -->
  <div id="portal-box">
    <a id="enter-game-link" href="game.html" class="portal-link">⚔ 進入亞丁大陸 ⚔</a>
  </div>
</div>

<script>
// 目標遊戲主頁面檔案名稱（可依你的專案檔名修改）
const TARGET_GAME_PAGE = "game.html";

function setMsg(text, type) {
  const el = document.getElementById('login-msg');
  el.textContent = text;
  el.className = type;
}

// 驗證帳號密碼（直接讀取同目錄下的 accounts.json）
async function verifyAccount() {
  const username = document.getElementById('input-user').value.trim();
  const password = document.getElementById('input-pass').value.trim();
  const portalBox = document.getElementById('portal-box');
  const enterLink = document.getElementById('enter-game-link');
  const btnLogin = document.getElementById('btn-login');

  // 每次重新驗證先隱藏轉跳連結
  portalBox.style.display = 'none';

  if (!username || !password) {
    return setMsg("請完整輸入帳號與密碼！", "msg-err");
  }

  btnLogin.disabled = true;
  setMsg("正在讀取 accounts.json 驗證資料...", "msg-info");

  try {
    const res = await fetch(`./accounts.json?t=${Date.now()}`);
    if (!res.ok) {
      return setMsg(`無法讀取 accounts.json (狀態碼: ${res.status})，請確認檔案位置。`, "msg-err");
    }

    const accounts = await res.json();

    // 比對帳號與密碼
    if (accounts[username] && accounts[username] === password) {
      sessionStorage.setItem('lineage_logged_user', username);
      enterLink.href = `${TARGET_GAME_PAGE}?user=${encodeURIComponent(username)}`;
      portalBox.style.display = 'block';
      setMsg(`驗證成功！歡迎【${username}】，請點擊下方按鈕進入遊戲。`, "msg-ok");
    } else {
      setMsg("帳號或密碼錯誤，無法開放進入！", "msg-err");
    }
  } catch (err) {
    setMsg("讀取 accounts.json 失敗！請透過 GitHub Pages 或本機伺服器開啟網頁。", "msg-err");
    console.error(err);
  } finally {
    btnLogin.disabled = false;
  }
}
</script>
</body>
</html>
